[input]
# Invert directional input (e.g. thumbsticks) on the x-axis to correct for the mirrored screen.
invert_directions=true

# Swap the controls for left/right attacks (e.g. triggers/bumpers) to match the now left-handed player character.
invert_attacks=false

# Swap the weapon switch icons and buttons.
invert_weapon_switch=false

# Set a key to toggle mirror mode.
# Find key codes here: https://docs.microsoft.com/en-us/windows/win32/inputdev/virtual-key-codes
# 0xBB: the '+' key
toggle_key=0xBB

[compatibility]
# If you want to install another mod that uses dinput8.dll,
# uncomment the line below and set the path of the dll.
# Note that paths are relative to DARKSOULS.exe.
#load_dll=othermod.dll

[debug]
# Debug options for development/troubleshooting purposes.
#log_file=dsmirror\dsmirror.log
#show_console=true
